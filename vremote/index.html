<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2026 露營晚會歌曲｜影片遙控</title>
<style>
html,body,*{-webkit-text-size-adjust:100%!important;text-size-adjust:100%!important}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#14110F;color:#F3EEE6;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
header{display:flex;align-items:center;gap:14px;padding:14px 20px;background:#1E1A17;border-bottom:3px solid #F5C518;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:26px;letter-spacing:3px;color:#F5C518}
#role{font-size:15px;padding:4px 12px;border-radius:14px;background:#3A332D;color:#E8E0D4}
#role.player{background:#C41F27;color:#fff}
#role.remote{background:#1F7A5A;color:#fff}
#state{margin-left:auto;font-size:14px;color:#A89F94}
#pick{padding:28px 20px;text-align:center}
#pick.compact{padding:8px 20px 0}#pick.compact p{display:none}#pick.compact .btn{font-size:15px;padding:8px 16px}
#pick p{font-size:18px;color:#C9C0B4;line-height:1.7;margin:0 0 18px}
.btn{display:inline-block;border:0;border-radius:12px;padding:14px 26px;margin:6px;font-size:20px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.y{background:#F5C518;color:#14110F}
.btn.g{background:#3A332D;color:#F3EEE6}
#tools{display:flex;align-items:center;gap:14px;padding:16px 20px 0;flex-wrap:wrap}
#tools .btn{margin:0}#tools .rnd{font-size:22px;padding:12px 28px}
header .hd{font-size:14px;padding:6px 12px;margin:0;color:#C9C0B4;background:#2A241F;white-space:nowrap}
.sm{display:none}
[hidden]{display:none!important}
#undo{background:#1F7A5A!important;color:#fff!important}
.cnt{font-size:17px;color:#A89F94}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:10px 14px;padding:16px 20px 150px}
.grp{grid-column:1/-1;margin:14px 0 0;font-size:26px;letter-spacing:3px;color:#F5C518;border-left:6px solid #C41F27;padding-left:12px}
.grp:first-child{margin-top:0}
.grp{scroll-margin-top:80px}
.grp small{font-size:16px;color:#A89F94;letter-spacing:1px;margin-left:12px;font-weight:400}
.tile{position:relative;display:flex;align-items:center;gap:12px;background:#211C18;border:2px solid #3A332D;border-radius:10px;padding:10px 14px;cursor:pointer;user-select:none;-webkit-user-select:none}
.tile:hover{border-color:#F5C518}
.tile.on{border-color:#C41F27;box-shadow:0 0 0 3px #C41F27}
.tile .no{flex:none;background:#F5C518;color:#14110F;font-weight:900;font-size:18px;border-radius:8px;padding:2px 9px}
.tile .nm{font-size:20px;line-height:1.35;font-weight:700;flex:1}
.tile .ck{display:none;flex:none;font-size:14px;color:#8FD3B0}
.tile.done{background:#163028;border-color:#2B5A48}
.tile.done .nm{color:#8FB5A5}.tile.done .no{background:#2B5A48;color:#CFE8DC}
.tile.done .ck{display:inline}
/* 檢視切換＋36 宮格賓果 */
.vw{display:inline-flex;background:#2A241F;border-radius:12px;padding:4px;gap:4px}
.vw button{border:0;background:none;color:#C9C0B4;font:700 17px inherit;font-family:inherit;padding:8px 16px;border-radius:9px;cursor:pointer}
.vw button.on{background:#F5C518;color:#14110F}
body.bingo #grid{display:none}
#bingo{display:none;padding:12px 20px 150px}
body.bingo #bingo{display:block}
#bBoard{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:0 auto;max-width:calc((100vh - 175px) * 1.75)}
.cell{position:relative;height:calc((100vh - 230px) / 6);min-height:62px;background:#211C18;border:2px solid #3A332D;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none;padding:4px;transition:background .4s,color .4s,box-shadow .4s}
.cell:hover{border-color:#F5C518}
.cell .cn{position:absolute;top:4px;left:7px;font-size:13px;color:#7D746A;font-weight:700}
.cell .pn{font-size:clamp(14px,min(2.4vw,4.4vh),34px);white-space:nowrap;font-weight:900;letter-spacing:2px;line-height:1.15}
.cell .sn{font-size:clamp(10px,min(1.1vw,2.1vh),15px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:#A89F94;margin-top:4px;line-height:1.2}
.cell.done{background:#3B2F12;border-color:#9C7A1C;color:#FFE27A}
.cell.done .sn,.cell.done .cn{color:#D9B95A}
.cell.on{border-color:#C41F27;box-shadow:0 0 0 3px #C41F27}
.cell.line{background:#F5C518;border-color:#FFF3B0;color:#14110F;box-shadow:0 0 18px 4px rgba(245,197,24,.75);animation:glow 1.6s ease-in-out infinite}
.cell.line .sn,.cell.line .cn{color:#5A4500}
@keyframes glow{50%{box-shadow:0 0 30px 9px rgba(255,226,122,.95)}}
.lines{font-size:17px;color:#F5C518;font-weight:700}
#boom{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:30;pointer-events:none;background:rgba(0,0,0,.45)}
#boom.show{display:flex}
#boom div{font-size:min(16vw,170px);font-weight:900;color:#F5C518;letter-spacing:8px;text-shadow:0 0 40px #F5C518,0 6px 0 #C41F27;animation:pop .7s ease-out;text-align:center;line-height:1.1}
#boom small{display:block;font-size:min(5vw,46px);letter-spacing:4px;color:#fff;text-shadow:none}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
#aCard{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;color:#F5C518;text-align:center;pointer-events:none}
#aCard b{font-size:min(9vw,96px);letter-spacing:6px}
#aCard span{font-size:min(4vw,36px);color:#E8E0D4;margin-top:16px}
#noPl{display:none;margin:10px 20px 0;padding:10px 14px;border-radius:10px;background:#1F3A2E;color:#CDEBDB;font-size:16px;line-height:1.5}
/* 封面＋宮格 */
#bWrap{display:flex;align-items:center;gap:22px;justify-content:center}
#cover{flex:none;height:calc(100vh - 190px);max-height:900px;width:auto;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6))}
#bWrap #bBoard{flex:1;margin:0;max-width:calc((100vh - 175px) * 1.75)}
/* 滑鼠移到格子：歌曲資訊卡 */
#tip{position:fixed;z-index:25;display:none;width:min(420px,92vw);max-height:calc(100vh - 40px);overflow:auto;background:#FFFFFF;border:3px solid #F5C518;border-radius:14px;padding:18px 20px;box-shadow:0 12px 40px rgba(0,0,0,.7);pointer-events:none}
#tip.show{display:block}
#tip h3{margin:0 0 10px;font-size:22px;color:#111;letter-spacing:1px;line-height:1.35}
#tip .tg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
#tip .tg span{background:#C41F27;color:#fff;border-radius:8px;padding:3px 10px;font-size:15px;font-weight:700}
#tip .tg span.b{background:#EDE6DA;color:#333}
#tip .ft{font-size:14px;color:#555;line-height:1.55;margin-bottom:12px;border-bottom:1px solid #DDD;padding-bottom:10px}
#tip .ly{font-size:17px;line-height:1.75;color:#111;white-space:pre-line}
body.touch #tip{pointer-events:auto;left:4vw!important;top:auto!important;bottom:12px;max-height:70vh}
@media (max-height:620px) and (min-width:601px){.cell .sn{display:none}.cell .cn{font-size:11px}}
/* 視窗較窄時標題列縮小，避免右邊按鈕被擠出去 */
@media (max-width:1350px) and (min-width:601px){header{gap:8px;padding:12px 14px}header h1{font-size:21px;letter-spacing:1px;white-space:nowrap}#state{font-size:12px;white-space:nowrap}header .hd,#swap{white-space:nowrap}}
/* 播放端：影片蓋滿全螢幕 */
#stageV{position:fixed;inset:0;background:#000;z-index:20;display:none;overflow:hidden}
#stageV.show{display:block}
#stageV video{width:100%;height:100%;object-fit:contain;background:#000}
#vTitle{position:absolute;top:14px;left:18px;font-size:20px;color:#fff;background:rgba(0,0,0,.55);padding:4px 14px;border-radius:10px;transition:opacity .6s}
#vBack{position:absolute;top:12px;right:16px;transition:opacity .6s}
#stageV.idle #vTitle,#stageV.idle #vBack{opacity:0}
/* 手機：回影片牆按鈕一直顯示 */
body.touch #stageV.idle #vBack,body.touch #stageV.idle #vTitle{opacity:1}
body.touch #vBack{z-index:5;font-size:18px;padding:10px 16px}
#unmute{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;font-size:26px}
/* 遙控器 */
#bar{position:fixed;left:0;right:0;bottom:0;background:#1E1A17;border-top:3px solid #C41F27;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:none;z-index:10}
#bar.show{display:block}
/* 桌機投影：底部時間軸（一直顯示，可點可拖） */
#pTL{position:absolute;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;gap:16px;padding:0 28px;background:linear-gradient(transparent,rgba(0,0,0,.75));z-index:2}
#pTL span{font-size:20px;color:#fff;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:center}
#pSeek{flex:1;accent-color:#F5C518;height:30px;cursor:pointer}
/* 手機遙控：上方同步播放（靜音） */
#rBox{position:fixed;left:0;right:0;top:0;background:#000;z-index:9;display:none;overflow:hidden}
#rBox.show{display:block}
#rv{position:absolute;width:100%;height:100%;object-fit:contain}
#bName{font-size:18px;font-weight:700;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bName b{color:#F5C518;margin-right:6px}
#seek{width:100%;accent-color:#F5C518;height:28px}
#bTime{display:flex;justify-content:space-between;font-size:14px;color:#A89F94;margin:-2px 0 6px}
#bBtns{display:flex;gap:8px}
#bBtns .btn{flex:1;margin:0;padding:12px 0;font-size:19px}
#bPlay{background:#C41F27!important;color:#fff!important}
#solo{display:none;font-size:14px;color:#A89F94;padding:0 20px}
@media (max-width:600px){
 header{gap:8px;padding:10px 12px}
 header h1{font-size:18px;letter-spacing:1px;white-space:nowrap}
 #role{font-size:12px;white-space:nowrap;padding:3px 8px}
 #state{display:none}
 #swap{margin-left:auto!important}
 #swap{font-size:13px!important;padding:5px 9px!important;white-space:nowrap}
 #grid{grid-template-columns:1fr;gap:7px;padding:10px 10px 210px}
 .tile{padding:9px 10px;gap:9px}
 .tile .nm{font-size:16px}
 .tile .no{font-size:14px;padding:1px 7px}
 .tile .ck{font-size:12px}
 #tools{padding:10px 10px 0;gap:10px}
 #tools .rnd{font-size:18px;padding:10px 18px}
 header .hd{font-size:12px;padding:5px 8px}
 .lg{display:none}.sm{display:inline}
 header h1{font-size:16px!important}
 #role{display:none!important}
 #undo{margin-left:auto!important}
 #undo+#clr,#undo[hidden]+#clr{margin-left:0}
 #undo[hidden]+#clr{margin-left:auto!important}
 #swap{margin-left:0!important}
 header{flex-wrap:nowrap}
 .cnt{font-size:14px}
 .grp{font-size:20px;margin-top:10px}
 .vw button{font-size:14px;padding:6px 10px}
 #bingo{padding:8px 6px 220px}
 #bBoard{gap:4px}
 #bWrap{flex-direction:column;gap:10px}
 #cover{height:170px}
 #bWrap #bBoard{width:100%;max-width:none}
 .cell{height:auto;aspect-ratio:3/4;min-height:0;border-radius:7px;padding:2px}
 .cell .pn{font-size:14px;letter-spacing:0}
 .cell .sn{display:none}
 .cell .cn{font-size:10px;top:2px;left:4px}
 .lines{font-size:14px}
 #pick p{font-size:16px}
 #pick.compact{display:none}
}
</style>

<body class="bingo">
<header><h1>2026 露營晚會歌曲</h1><span id="role">尚未選片</span><span id="state"></span><button id="undo" class="btn g hd" hidden>↩ 復原</button><button class="btn g hd" id="clr"><span class="lg">清除播過紀錄</span><span class="sm">清除</span></button><button id="swap" class="btn g" style="font-size:15px;padding:6px 14px;margin:0">切換</button></header>
<div id="tools"><span class="vw"><button data-v="bingo" class="on">36 宮格</button><button data-v="list">清單</button></span><button class="btn y rnd">🎲 隨機播放</button><span class="cnt"></span><span class="lines"></span></div>

<section id="pick">
 <p id="pickMsg">【桌機】按下面的按鈕，選放影片的資料夾，這台就會負責播放。<br>【手機】用同一個網址打開，等桌機選好資料夾，片單會自動出現，就能遙控。</p>

<main id="grid"></main>

<div id="stageV">
 <video id="vid" playsinline></video>
 <div id="aCard"><b></b><span></span></div>
 <div id="vTitle"></div>
 <button id="vBack" class="btn g">✕ 回影片牆</button>
 <button id="unmute" class="btn y">🔊 按一下開啟聲音</button>

</div>

  <button class="btn g" data-a="rnd">🎲</button><button class="btn g" data-a="prev">⏮</button>

 </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="../sync-config.js?v=independent1"></script>
<script>
/* 播放時放大重點：直式 Suno 影片只取中間「標題＋圖片＋歌詞」區塊撐滿螢幕 */
var FOCUS={x:.13,y:.145,w:.74,h:.585};
function fitFocus(){fitOne(document.getElementById('vid'),innerWidth,innerHeight-64);var b=document.getElementById('rBox');if(b&&b.offsetHeight)fitOne(document.getElementById('rv'),b.offsetWidth,b.offsetHeight);}
function fitOne(v,W,H){if(!v)return;var vw=v.videoWidth,vh=v.videoHeight;
 if(!vw||!vh||vh<=vw){v.style.cssText='';return;}
 var rw=vw*FOCUS.w,rh=vh*FOCUS.h,s=Math.min(W/rw,H/rh);
 v.style.cssText='position:absolute;object-fit:fill;max-width:none;width:'+vw*s+'px;height:'+vh*s+'px;left:'+(W/2-(vw*FOCUS.x+rw/2)*s)+'px;top:'+(H/2-(vh*FOCUS.y+rh/2)*s)+'px;clip-path:inset('+vh*FOCUS.y*s+'px 0 '+vh*(1-FOCUS.y-FOCUS.h)*s+'px 0)';}
addEventListener('resize',fitFocus);
document.addEventListener('DOMContentLoaded',function(){['vid','rv'].forEach(function(id){var v=document.getElementById(id);v.addEventListener('loadedmetadata',fitFocus);v.addEventListener('emptied',fitFocus);});});
</script>
<script>
(function(){'use strict';
var $=function(s){return document.querySelector(s);};
var room=new URLSearchParams(location.search).get('sync');
if(room&&!/^[a-zA-Z0-9_-]{4,60}$/.test(room))room=null;
var me=String(Date.now())+Math.random().toString(36).slice(2);
var playerInfo=null,off=0,played={},order=[],site=false,isPlayer=false,files=[],list=[],pos={open:false},lastSeq=null,ref=null,db=null;
var vid=$('#vid'),stageV=$('#stageV'),grid=$('#grid'),bar=$('#bar'),seek=$('#seek'),dragging=false;
var LINES=[],seenLines=-1;(function(){var r,c;for(r=0;r<6;r++){var a=[];for(c=0;c<6;c++)a.push(r*6+c);LINES.push(a);}
 for(c=0;c<6;c++){var b=[];for(r=0;r<6;r++)b.push(r*6+c);LINES.push(b);}
 var d1=[],d2=[];for(r=0;r<6;r++){d1.push(r*6+r);d2.push(r*6+5-r);}LINES.push(d1,d2);})();

function fmt(t){t=Math.max(0,Math.floor(t||0));var m=Math.floor(t/60),s=t%60;return m+':'+(s<10?'0':'')+s;}
function setState(t){$('#state').textContent=t;}
function setRole(){var r=$('#role');r.className=isPlayer?'player':(list.length?'remote':'');r.textContent=isPlayer?'這台：播放端':(list.length?'這台：遙控器':'尚未選片');
 $('#pick').style.display=site?'none':'';$('#pick').classList.toggle('compact',!!(list.length&&!isPlayer&&room));
 if(isPlayer)$('#pickMsg').innerHTML='已選好 '+files.length+' 支影片。要換資料夾，再按一次下面的按鈕。'+(room?'<br>手機用同一個網址打開，就能遙控。':'');}

/* ---------- 連線 ---------- */
if(room&&window.firebase&&window.FIVESTORY_FIREBASE_CONFIG){
 try{if(!firebase.apps.length)firebase.initializeApp(window.FIVESTORY_FIREBASE_CONFIG);db=firebase.database();
  ref=db.ref('rooms/'+room+'/screen/localVideo');setState('連線中…');
  db.ref('.info/serverTimeOffset').on('value',function(s){off=s.val()||0;});
  db.ref('.info/connected').on('value',function(s){setState(s.val()?'● 已連線':'連線中斷…');});
  ref.child('list').on('value',function(s){var v=s.val();if(isPlayer||site)return;list=(v&&v.items)||[];render();setRole();});
  ref.child('played').on('value',function(s){if(!mark.got){mark.got=1;seenLines=-1;}played=s.val()||{};mark();});
  ref.child('pos').on('value',function(s){if(isPlayer)return;pos=s.val()||{open:false};showBar();});
  ref.child('cmd').on('value',function(s){var c=s.val();if(!c||c.seq===lastSeq)return;var first=lastSeq===null;lastSeq=c.seq;if(first&&Date.now()-(c.at||0)>5000)return;if(isPlayer)exec(c);});
 }catch(e){setState('連線失敗');console.error(e);room=null;}
}else{$('#solo').style.display=room?'none':'block';}

function now(){return Date.now()+(off||0);}
function playerActive(){return !!(playerInfo&&playerInfo.id&&now()-(playerInfo.at||0)<45000);}
function send(c){if(c.a==='open'&&window.__hideTip)window.__hideTip();/* 連線中但沒有播放端（桌機沒開）：手機點歌就自己當播放端 */
 if(ref&&room&&!isPlayer&&c.a==='open'&&!playerActive())setPlayer(true);
 c.seq=me+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,6);c.at=Date.now();
 if(ref&&room){if(isPlayer)lastSeq=c.seq;ref.child('cmd').set(c);if(isPlayer)exec(c);}else exec(c);}

/* ---------- 影片牆 ---------- */
/* 分兩類：有作者（自己完成）／由採訪者完成；編號維持原檔編號 */
function groups(){var a=[],b=[],c=[];list.forEach(function(it,i){(it.who==='全部'?c:/採訪者/.test(it.who||'')?b:a).push(i);});
 var g=b.length?[['作者親自完成',a],['由採訪者完成',b]]:[['',a]];if(c.length)g.push(['全體',c]);return g;}
function render(){grid.innerHTML='';order=[];groups().forEach(function(g){
 if(g[0]){var h=document.createElement('h2');h.className='grp';h.innerHTML=g[0]+'<small>'+g[1].length+' 首</small>';grid.appendChild(h);}
 g[1].forEach(function(i){var it=list[i];order.push(i);var d=document.createElement('div');d.className='tile';d.dataset.i=i;
 var no=(i<9?'0':'')+(i+1);d.innerHTML='<span class="no">'+no+'</span><span class="nm"></span><span class="ck">✓ 播過</span>';
 d.querySelector('.nm').textContent=it.name+(it.who?'｜'+it.who:'');grid.appendChild(d);});});renderBingo();mark();}
/* ---------- 36 宮格：格子照編號排，播過亮起，連成一線發光 ---------- */

/* 宮格排列：其他作者（含全體）→ 指定 8 位 → 12 位採訪者排最後兩列 */
var LATE=[15,8,4,13,34,18,6,2],LAY=[];
function makeLay(){var rest=[],late=[],iv=[],all=null;list.forEach(function(it,k){var n=k+1;
  if(/採訪者/.test(it.who||''))iv.push(k);else if(it.who==='全部')all=k;else if(LATE.indexOf(n)<0)rest.push(k);});
 LATE.forEach(function(n){if(list[n-1])late.push(n-1);});if(all!==null)rest.push(all);LAY=rest.concat(late,iv);}
function renderBingo(){makeLay();var B=$('#bBoard');B.innerHTML='';for(var q=0;q<36;q++){var i=LAY[q],it=list[i],d=document.createElement('div');d.className='cell';
 if(!it){d.style.visibility='hidden';B.appendChild(d);continue;}d.dataset.i=i;
 d.innerHTML='<span class="cn">'+(i<9?'0':'')+(i+1)+'</span><span class="pn"></span><span class="sn"></span>';
 d.querySelector('.pn').textContent=it.who==='全部'?'全體':(it.who||'').replace(/的採訪者$/,'')||it.name;d.querySelector('.sn').textContent=it.name;B.appendChild(d);}}
function bingoLines(){return LINES.map(function(L){return L.map(function(q){return LAY[q];});}).filter(function(L){return L.every(function(i){return i!=null&&list[i]&&played[i];});});}
/* 歌曲資訊卡（歌詞、曲風） */
var LY={};fetch('videos/lyrics.json?v='+Date.now()).then(function(r){return r.ok?r.json():{};}).then(function(j){LY=j||{};}).catch(function(){});
var tip=$('#tip'),tipFor=-1,lpT=null,lpDone=false;
function esc(t){return String(t||'').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function showTip(cell){var i=+cell.dataset.i,it=list[i];if(!it)return;var k=(i<9?'0':'')+(i+1),d=LY[k]||{};tipFor=i;
 tip.innerHTML='<h3>'+esc(d.title||(k+'｜'+it.name+(it.who?'｜'+it.who:'')))+'</h3>'+
  ((d.style||d.bpm)?'<div class="tg">'+(d.style?'<span>'+esc(d.style)+'</span>':'')+(d.bpm?'<span class="b">BPM '+esc(d.bpm)+'</span>':'')+'</div>':'')+
  (d.feat?'<div class="ft">'+esc(d.feat)+'</div>':'')+(d.lyrics?'<div class="ly">'+esc(d.lyrics)+'</div>':'<div class="ft">（全體大合唱）</div>');
 tip.classList.add('show');if(document.body.classList.contains('touch'))return;
 var r=cell.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight,x=r.right+12;if(x+tw>innerWidth-10)x=r.left-tw-12;if(x<10)x=10;
 var y=r.top+r.height/2-th/2;y=Math.max(10,Math.min(y,innerHeight-th-10));tip.style.left=x+'px';tip.style.top=y+'px';}
function hideTip(){tip.classList.remove('show');tipFor=-1;}window.__hideTip=hideTip;
$('#bBoard').addEventListener('mouseover',function(e){if(document.body.classList.contains('touch'))return;var c=e.target.closest('.cell[data-i]');if(c&&+c.dataset.i!==tipFor)showTip(c);});
$('#bBoard').addEventListener('mouseleave',hideTip);
/* 手機：長按格子看歌詞，點一下播放 */
$('#bBoard').addEventListener('touchstart',function(e){var c=e.target.closest('.cell[data-i]');lpDone=false;if(!c)return;clearTimeout(lpT);lpT=setTimeout(function(){lpDone=true;showTip(c);},500);},{passive:true});
['touchend','touchmove','touchcancel'].forEach(function(ev){$('#bBoard').addEventListener(ev,function(){clearTimeout(lpT);},{passive:true});});
$('#bBoard').addEventListener('contextmenu',function(e){if(document.body.classList.contains('touch'))e.preventDefault();});
document.addEventListener('click',function(e){if(lpDone)return;if(tip.classList.contains('show')&&document.body.classList.contains('touch')&&!e.target.closest('#tip'))hideTip();},true);
$('#bBoard').addEventListener('click',function(e){if(lpDone){lpDone=false;e.stopImmediatePropagation();}},true);
$('#bBoard').addEventListener('click',function(e){var t=e.target.closest('.cell');if(t&&t.dataset.i)send({a:'open',i:+t.dataset.i});});
function boom(n){var b=$('#boom');b.querySelector('small').textContent='第 '+n+' 條線';b.classList.add('show');clearTimeout(boom.t);boom.t=setTimeout(function(){b.classList.remove('show');},3200);}
function mark(){[].forEach.call(grid.querySelectorAll('.tile'),function(d){var i=+d.dataset.i;d.classList.toggle('on',pos.open&&i===pos.idx);d.classList.toggle('done',!!played[i]);});
 var Ls=bingoLines(),lit={};Ls.forEach(function(L){L.forEach(function(i){lit[i]=1;});});
 [].forEach.call(document.querySelectorAll('#bBoard .cell[data-i]'),function(d){var i=+d.dataset.i;d.classList.toggle('done',!!played[i]);d.classList.toggle('line',!!lit[i]);d.classList.toggle('on',pos.open&&i===pos.idx);});
 $('.lines').textContent=Ls.length?'★ 連線 '+Ls.length+' 條':'';
 var playing=isPlayer?curIdx>=0:pos.open;
 if(!list.length)return;
 if(seenLines<0||Ls.length<seenLines)seenLines=Ls.length;
 else if(Ls.length>seenLines&&!playing&&document.body.classList.contains('bingo')){seenLines=Ls.length;boom(Ls.length);}
 var n=Object.keys(played).length;[].forEach.call(document.querySelectorAll('.cnt'),function(e){e.textContent=list.length?'已播 '+n+'／'+list.length:'';});}
/* 隨機：從還沒播過的挑一首 */
function rnd(){var pool=order.filter(function(i){return !played[i];});
 if(!pool.length){if(confirm('全部都播過了，要清除紀錄、重新開始嗎？'))resetPlayed();return;}
 send({a:'open',i:pool[Math.floor(Math.random()*pool.length)]});}
function resetPlayed(){var bak=JSON.parse(JSON.stringify(played));undoBak=bak;if(ref&&room)ref.child('playedBak').set(bak);played={};if(ref&&room)ref.child('played').set(null);mark();showUndo();}
var undoBak=null;function showUndo(){$('#undo').hidden=!(undoBak&&Object.keys(undoBak).length);}
function undoPlayed(){if(!undoBak)return;played=undoBak;undoBak=null;if(ref&&room){ref.child('played').set(played);ref.child('playedBak').set(null);}seenLines=-1;mark();showUndo();}
function savePlayed(){if(ref&&room)ref.child('played').set(played);}
grid.addEventListener('click',function(e){var t=e.target.closest('.tile');if(t)send({a:'open',i:+t.dataset.i});});

/* ---------- 遙控列 ---------- */
function showBar(){mark();var on=pos.open&&list[pos.idx];bar.classList.toggle('show',!!on&&!isPlayer);syncRemote();if(!on)return;
 $('#bName').innerHTML='<b>'+(pos.idx+1)+'</b>';$('#bName').appendChild(document.createTextNode(list[pos.idx].name));
 $('#bPlay').textContent=pos.paused?'▶ 播放':'⏸ 暫停';
 if(!dragging){seek.value=pos.d?Math.round(pos.t/pos.d*1000):0;$('#tCur').textContent=fmt(pos.t);}
 $('#tDur').textContent=fmt(pos.d);}
bar.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a;
 if(a==='rnd')rnd();
 else if(a==='toggle')send({a:pos.paused?'play':'pause'});
 else if(a==='back10'||a==='fwd10')send({a:'seek',t:Math.max(0,(pos.t||0)+(a==='fwd10'?10:-10))});
 else if(a==='prev'||a==='next'){var k=order.indexOf(pos.idx)+(a==='next'?1:-1);if(k>=0&&k<order.length)send({a:'open',i:order[k]});}
 else if(a==='close')send({a:'close'});});
seek.addEventListener('input',function(){dragging=true;$('#tCur').textContent=fmt(seek.value/1000*(pos.d||0));});
seek.addEventListener('change',function(){dragging=false;send({a:'seek',t:seek.value/1000*(pos.d||0)});});

/* ---------- 播放端 ---------- */
var curIdx=-1,url=null;
function exec(c){if(!isPlayer)return;
 if(c.a==='open'&&list[c.i]){if(url){URL.revokeObjectURL(url);url=null;}if(files[c.i]){url=URL.createObjectURL(files[c.i]);vid.src=url;}else vid.src='videos/'+encodeURIComponent(list[c.i].file);curIdx=c.i;played[c.i]=1;savePlayed();
  $('#vTitle').textContent=(c.i+1)+'　'+list[c.i].name+(list[c.i].who?'｜'+list[c.i].who:'');var au=/\.mp3$/i.test(list[c.i].file||'');$('#aCard').style.display=au?'flex':'none';if(au){$('#aCard b').textContent=list[c.i].name;$('#aCard span').textContent=list[c.i].who==='全部'?'全體大合唱':list[c.i].who;}stageV.classList.add('show');wake();tryPlay();}
 else if(c.a==='play')tryPlay();
 else if(c.a==='pause')vid.pause();
 else if(c.a==='seek'&&isFinite(c.t))vid.currentTime=Math.min(c.t,vid.duration||c.t);
 else if(c.a==='close'){vid.pause();stageV.classList.remove('show');curIdx=-1;if(document.fullscreenElement)document.exitFullscreen().catch(function(){});}
 pub();}
function tryPlay(){vid.muted=false;var p=vid.play();if(p&&p.catch)p.catch(function(){vid.muted=true;vid.play().catch(function(){});$('#unmute').style.display='block';});}
$('#unmute').onclick=function(){vid.muted=false;this.style.display='none';};
$('#vBack').onclick=function(){send({a:'close'});};
var lastPub=0;
function pub(){var p={open:curIdx>=0,idx:curIdx,t:vid.currentTime||0,d:vid.duration||0,paused:vid.paused,at:Date.now()+off};pos=p;mark();ptl();
 if(ref&&room){lastPub=Date.now();ref.child('pos').set(p);}}
['play','pause','seeked','loadedmetadata','ended'].forEach(function(ev){vid.addEventListener(ev,pub);});
vid.addEventListener('ended',function(){if(isPlayer&&curIdx>=0)setTimeout(function(){if(vid.ended)send({a:'close'});},1500);});
vid.addEventListener('timeupdate',function(){ptl();if(Date.now()-lastPub>900)pub();});
/* 桌機時間軸 */
var pDrag=false,pS=$('#pSeek');
function ptl(){var d=vid.duration||0;if(!pDrag){pS.value=d?Math.round(vid.currentTime/d*1000):0;$('#pCur').textContent=fmt(vid.currentTime);}$('#pDur').textContent=fmt(d);}
pS.addEventListener('input',function(){pDrag=true;$('#pCur').textContent=fmt(pS.value/1000*(vid.duration||0));});
pS.addEventListener('change',function(){pDrag=false;send({a:'seek',t:pS.value/1000*(vid.duration||0)});});
/* 手機遙控：上方同步播放同一支影片（靜音），進度跟著播放端 */
var rv=$('#rv'),rBox=$('#rBox'),rvSound=false;
function sndBtn(){var b=$('#rSnd');if(b){b.textContent=rvSound?'🔊 手機出聲中':'🔈 手機也出聲';b.style.background=rvSound?'#1F7A5A':'';b.style.color=rvSound?'#fff':'';}}
$('#rSnd').addEventListener('click',function(e){e.stopPropagation();rvSound=!rvSound;rv.muted=!rvSound;if(rvSound&&rv.paused&&!pos.paused)rv.play().catch(function(){});sndBtn();});
function syncRemote(){if(!rBox)return;var on=!isPlayer&&site&&pos.open&&list[pos.idx];
 if(!on){if(rBox.classList.contains('show')){rBox.classList.remove('show');rv.pause();rv.removeAttribute('src');rv.load();delete rv.dataset.i;}return;}
 rBox.style.bottom=bar.offsetHeight+'px';if(!rBox.classList.contains('show')){rBox.classList.add('show');setTimeout(fitFocus,0);}
 if(rv.dataset.i!=String(pos.idx)){rv.dataset.i=pos.idx;rv.muted=!rvSound;rv.src='videos/'+encodeURIComponent(list[pos.idx].file);}
 var tgt=(pos.t||0)+(pos.paused||!pos.at?0:Math.max(0,(Date.now()+off-pos.at)/1000));if(pos.d)tgt=Math.min(tgt,pos.d);
 if(rv.readyState>=1&&Math.abs(rv.currentTime-tgt)>0.7)rv.currentTime=tgt;
 if(pos.paused){if(!rv.paused)rv.pause();}else if(rv.paused)rv.play().catch(function(){if(!rv.muted){rv.muted=true;rvSound=false;sndBtn();rv.play().catch(function(){});}});
 if(!dragging){$('#tCur').textContent=fmt(tgt);seek.value=pos.d?Math.round(tgt/pos.d*1000):0;}}
rv.addEventListener('loadedmetadata',syncRemote);
setInterval(function(){if(!isPlayer)syncRemote();},1000);
vid.addEventListener('click',function(){send({a:vid.paused?'play':'pause'});});
document.addEventListener('keydown',function(e){if(!isPlayer||curIdx<0)return;
 if(e.key===' '){e.preventDefault();send({a:vid.paused?'play':'pause'});}
 else if(e.key==='Escape')send({a:'close'});
 else if(e.key==='ArrowRight')send({a:'seek',t:vid.currentTime+10});
 else if(e.key==='ArrowLeft')send({a:'seek',t:Math.max(0,vid.currentTime-10)});});
var idleT;function wake(){stageV.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(function(){stageV.classList.add('idle');},2500);}
stageV.addEventListener('mousemove',wake);stageV.addEventListener('touchstart',wake,{passive:true});
if(matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>1)document.body.classList.add('touch');
/* 手機的返回手勢／返回鍵：回影片牆，不離開網頁 */
var pushed=false;
new MutationObserver(function(){var on=stageV.classList.contains('show');
 if(on&&!pushed&&document.body.classList.contains('touch')){history.pushState({vr:1},'');pushed=true;}
 else if(!on&&pushed){pushed=false;if(history.state&&history.state.vr)history.back();}}).observe(stageV,{attributes:true,attributeFilter:['class']});
addEventListener('popstate',function(){if(pushed){pushed=false;if(stageV.classList.contains('show'))send({a:'close'});}});

/* ---------- 選資料夾 ---------- */
function choose(fl){var v=[].filter.call(fl,function(f){return /^video\//.test(f.type)||/\.(mp4|m4v|mov|webm|mkv|ogv)$/i.test(f.name);});
 if(!v.length){alert('這個資料夾裡沒有找到影片檔（mp4、mov、webm…）');return;}
 v.sort(function(a,b){return (a.webkitRelativePath||a.name).localeCompare(b.webkitRelativePath||b.name,'zh-Hant',{numeric:true});});
 files=v;isPlayer=true;list=v.map(function(f){return {name:f.name.replace(/\.[^.]+$/,'').replace(/^\d+[\s._-]*/,'')||f.name};});
 render();setRole();publishList();}
function publishList(){if(ref&&room)ref.child('list').set({by:me,at:Date.now(),items:list});}
$('#dirIn').onchange=function(){choose(this.files);this.value='';};
$('#fileIn').onchange=function(){choose(this.files);this.value='';};

/* 縮圖：每支抓第 2 秒的畫面，做成小圖，手機也看得到 */
function thumbs(){var gen=files,k=0,tv=document.createElement('video'),cv=document.createElement('canvas');tv.muted=true;tv.preload='auto';cv.width=240;cv.height=135;
 function nx(){if(gen!==files)return;if(k>=files.length){publishList();return;}var u=URL.createObjectURL(files[k]);tv.src=u;
  var done=function(ok){URL.revokeObjectURL(u);if(ok){try{var c=cv.getContext('2d'),w=tv.videoWidth,h=tv.videoHeight,s=Math.max(240/w,135/h);c.fillStyle='#000';c.fillRect(0,0,240,135);c.drawImage(tv,(240-w*s)/2,(135-h*s)/2,w*s,h*s);list[k].th=cv.toDataURL('image/jpeg',.6);
   var t=grid.querySelector('.tile[data-i="'+k+'"] .th');if(t){t.style.backgroundImage='url('+list[k].th+')';t.textContent='';}}catch(e){}}
   k++;if(k%6===0)publishList();setTimeout(nx,0);};
  tv.onloadeddata=function(){tv.currentTime=Math.min(2,(tv.duration||4)/3);};tv.onseeked=function(){done(true);};tv.onerror=function(){done(false);};}
 nx();}
document.querySelector('#tools .rnd').onclick=rnd;
function setView(v){document.body.classList.toggle('bingo',v==='bingo');[].forEach.call(document.querySelectorAll('.vw button'),function(b){b.classList.toggle('on',b.dataset.v===v);});mark();}
document.querySelector('.vw').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;setView(b.dataset.v);if(ref&&room)ref.child('view').set(b.dataset.v);});
if(ref&&room)ref.child('view').on('value',function(s){setView(s.val()||'bingo');});
$('#undo').onclick=undoPlayed;
if(ref&&room)ref.child('playedBak').on('value',function(s){undoBak=s.val();showUndo();});
$('#clr').onclick=function(){if(confirm('確定清除「播過」的紀錄？'))resetPlayed();};
/* 同一房間只能有一個播放端：新的播放端登記後，其他播放端自動停播、變回遙控器 */
function setPlayer(on){isPlayer=on;if(!on&&curIdx>=0){vid.pause();vid.removeAttribute('src');vid.load();stageV.classList.remove('show');curIdx=-1;}
 if(on&&ref&&room){ref.child('player').set({id:me,at:now()});if(curIdx<0)pub();}render();setRole();showBar();}
if(ref&&room)ref.child('player').on('value',function(s){var v=s.val();playerInfo=v;if(isPlayer&&v&&v.id&&v.id!==me)setPlayer(false);noPlayerWarn();});
/* 播放端每 20 秒報到一次；遙控器 60 秒沒收到就提醒 */
setInterval(function(){if(isPlayer&&ref&&room)ref.child('player').set({id:me,at:now()});},20000);
function noPlayerWarn(){var w=$('#noPl');if(!w)return;var bad=room&&!isPlayer&&list.length&&!playerActive();w.style.display=bad?'block':'none';}
setInterval(noPlayerWarn,5000);
$('#swap').onclick=function(){setPlayer(!isPlayer);};
/* 網站上的影片：videos/list.json（[{file,name,th}]）。寬螢幕（桌機）自動當播放端，手機當遙控器 */
fetch('videos/list.json?v='+Date.now()).then(function(r){return r.ok?r.json():null;}).then(function(v){
 if(!v||!v.length){setRole();return;}
 site=true;seenLines=-1;list=v.map(function(it){return {file:it.file,name:it.name,who:it.who||'',th:it.th?'videos/'+it.th:''};});
 var touch=matchMedia('(pointer:coarse)').matches||navigator.maxTouchPoints>1&&!matchMedia('(pointer:fine)').matches;
 setPlayer(!room||!touch);
}).catch(function(){setRole();});
setRole();
})();
</script>
</body>
